name: Build unnnic in Shared (Push Tag)

on:
  push:
    tags:
      - '*.*.*-develop'
      - '*.*.*-staging'

jobs:
  call-workflow:
    uses: weni-ai/actions-workflows/.github/workflows/reusable-workflow.yaml@main
    with:
      image_repository: unnnic
      dockerfile: Dockerfile
      target_repository: weni-ai/kubernetes-manifests
      target_repository_branch: main
      target_application: unnnic
      target_patch_file: deployment.json
    secrets: inherit
